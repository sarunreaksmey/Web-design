<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Web Design</title>
    <style>
        .header {
            width: 800px;
            height: 80px;
            background-color: #25acefb6;
            margin: 0 auto;
        }

        .nav {
            width: 800px;
            height: 40px;
            background-color: #2a626d;
            margin: 0 auto;
        }
        .content {
            width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 0px;
        }

        .main {
            width: 480px;
            height: 265px;
            background-color: #5ab3b6;
            border: 2px solid #63878c;
            box-sizing: border-box;
            padding: 10px;
        }

        .article {
            width: 440px;
            height: 100px;
            background-color: #10312b;
            border: 2px solid #a6f6e7;
            margin: 10px 0;
            box-sizing: border-box;
        }

        .section {
            width: 440px;
            height: 100px;
            background-color: #42bdff;
            border: 2px solid #869abb;
            margin: 10px 0;
            box-sizing: border-box;
        }

        .aside {
            flex: 1;          
            width: 300px;
            height: 265px;
            background-color: #679fb7;
            border: 2px solid #4b0b26;
            border-radius: 0px;
            box-sizing: border-box;
        }

        .footer {
            width: 800px;
            height: 55px;
            background-color: #3f7980;
            border: 2px solid #9cccbe;
            margin: 0 auto;
            box-sizing: border-box;
        }

    </style>
</head>
<body>
    <div class="header"></div>
    <div class="nav"></div>
    <div class="content">
        <div class="main">
            <div class="article"></div>
            <div class="section"></div>
        </div>
        <div class="aside"></div>
    </div>
    <div class="footer"></div>
</body>
</html>
